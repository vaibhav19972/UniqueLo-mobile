name: CI

# Phase 2 verification matrix (docs/CONVENTIONS.md) on every push/PR to main.
# macOS is required for the iOS compile target (D-10: iOS must always compile).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android build + tests + lint + iOS target (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licences
        run: yes | command -v sdkmanager >/dev/null 2>&1 && true || true

      - name: Build + test + lint + iOS compile
        run: ./gradlew --console=plain :composeApp:assembleDebug :composeApp:testDebugUnitTest :composeApp:lintDebug :composeApp:compileKotlinIosSimulatorArm64

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: composeApp/build/reports
          if-no-files-found: ignore
